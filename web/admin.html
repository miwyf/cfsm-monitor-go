<!doctype html>
<html lang="zh-CN">
<head><script src="/appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>后台管理 · CFSM</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body><div class="shell">
  <header><a class="brand" href="/admin">CFSM <b>后台管理</b></a><nav><button id="theme-toggle" type="button" aria-label="切换主题">◐</button><a id="dashboard-link" class="admin-nav-link" href="/">返回看板</a><button id="logout" hidden>退出登录</button></nav></header>
  <p id="message" class="admin-message" role="status" hidden></p>
  <section id="setup-panel" class="admin-login" hidden><h1>创建管理员</h1><form id="setup-form"><label>账号<input id="setup-username" autocomplete="username" maxlength="64" required></label><label>密码<input id="setup-password" type="password" autocomplete="new-password" minlength="6" maxlength="1024" placeholder="至少 6 位" required></label><label>确认密码<input id="setup-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><button class="primary" type="submit">创建并登录</button></form></section>
  <section id="login-panel" class="admin-login" hidden><h1>管理员登录</h1><form id="login-form"><label>账号<input id="login-username" autocomplete="username" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></section>
  <main id="admin-layout" class="admin-layout" hidden>
    <aside class="admin-sidebar"><button data-panel="status" aria-current="page">采集状态</button><button data-panel="source">数据源设置</button><button data-panel="history">历史数据</button><button data-panel="notifications">消息推送</button><button data-panel="account">管理员账号</button></aside>
    <div class="admin-content">
      <section data-view="status"><div class="admin-heading"><h1>采集状态</h1><div><button id="reload-status">刷新</button><button id="collect">立即采集</button></div></div><div id="status-grid" class="status-grid"></div><div class="admin-box"><dl id="collection-details" class="detail-grid"></dl><p id="collection-error" class="collection-error" hidden></p></div></section>
      <section data-view="source" hidden><h1>数据源设置</h1><form id="source-form" class="admin-box form-grid"><label class="wide">CFSM 地址<input id="source-url" type="url" placeholder="https://status.example.com" autocomplete="off" required></label><label class="wide">App 访问口令<input id="source-key" type="password" autocomplete="new-password" maxlength="32"><small id="key-hint"></small></label><label>采集间隔（秒）<input id="source-interval" type="number" min="60" max="86400" required></label><div class="form-action"><button class="primary" type="submit">验证连接并保存</button></div></form></section>
      <section data-view="history" hidden><h1>历史数据</h1><div class="admin-box"><dl id="database-details" class="detail-grid"></dl></div><form id="retention-form" class="admin-box form-grid"><label>保留天数<input id="retention-days" type="number" min="30" max="3650" required><small>缩短天数会清理过期记录。</small></label><div class="form-action"><button type="submit">保存并清理过期记录</button></div></form><div class="admin-box"><form id="history-form" class="history-filters"><label>节点<select id="history-node" required></select></label><label>开始日期<input id="history-from" type="date" required></label><label>结束日期<input id="history-to" type="date" required></label><button type="submit">查询</button></form><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>日期</th><th>已记录 GiB</th><th>样本</th><th>记录状态</th></tr></thead><tbody id="history-rows"></tbody></table></div><div class="pagination"><span id="history-count"></span><div><button id="previous-page" disabled>上一页</button><button id="next-page" disabled>下一页</button></div></div></div><div class="admin-box danger-zone"><div><h2>清空流量历史</h2><p>清除所有节点的每日记录和采样基准。</p></div><button id="clear-open" class="danger-button">清空历史</button></div></section>
      <section data-view="notifications" hidden><div class="admin-heading"><h1>消息推送</h1><div><button id="notification-reload">刷新记录</button><button id="notification-add" class="primary">新增渠道</button></div></div><p id="notification-zone" class="notification-hint"></p><div id="notification-channels"></div><div class="admin-box"><h2>发送记录</h2><div class="admin-table-wrap"><table class="admin-table notification-table"><thead><tr><th>时间</th><th>渠道</th><th>类型</th><th>状态</th><th>尝试</th><th>结果</th><th></th></tr></thead><tbody id="notification-log"></tbody></table></div></div></section>
      <section data-view="account" hidden><h1>管理员账号</h1><form id="account-form" class="admin-box form-grid"><label>账号<input id="account-username" autocomplete="username" maxlength="64" required></label><label>当前密码<input id="account-current" type="password" autocomplete="current-password" required></label><label>新密码<input id="account-password" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><label>确认新密码<input id="account-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><div class="form-action wide"><small>保存后所有登录会话失效。</small><button class="primary" type="submit">保存账号</button></div></form></section>
    </div>
  </main>
<footer class="app-footer"><span id="app-version"></span></footer></div><dialog id="clear-dialog"><h2>确认清空历史？</h2><p>数据源和管理员账号保留。</p><div class="confirm-actions"><button id="clear-cancel">取消</button><button id="clear-confirm" class="danger-button">确认清空</button></div></dialog><dialog id="notification-dialog" aria-labelledby="notification-title"><form id="notification-form"><div class="dialog-head"><h2 id="notification-title">新增通知渠道</h2></div><p id="notification-error" class="form-message" role="alert"></p><div class="form-grid notification-form"><label>名称<input id="notify-name" maxlength="64" required></label><label>平台<select id="notify-provider"><option value="feishu">飞书</option><option value="wecom">企业微信</option><option value="dingtalk">钉钉</option></select></label><label class="wide">Webhook<input id="notify-webhook" type="password" autocomplete="new-password" maxlength="2048" required></label><div id="notify-secret-label" class="wide"><label>签名密钥<input id="notify-secret" type="password" autocomplete="new-password" maxlength="512"></label><label class="check-line"><input id="notify-clear-secret" type="checkbox">清除已保存的签名密钥</label></div><label>节点范围<select id="notify-scope"><option value="public">仅公开节点</option><option value="hidden">仅隐藏节点</option><option value="all">全部节点</option><option value="selected">指定节点</option></select></label><label class="check-line"><input id="notify-enabled" type="checkbox" checked>启用此渠道</label><label id="notify-nodes-label" class="wide" hidden>选择节点<select id="notify-nodes" multiple size="5"></select></label><fieldset class="wide"><legend><label class="check-line"><input id="notify-alerts" type="checkbox" checked>流量预警</label></legend><div class="form-grid"><label>周期配额阈值（%）<input id="notify-thresholds" placeholder="80, 90, 100"><small>多个阈值用逗号分隔；同周期越过阈值后不重复发送。</small></label><label>今日用量达到（GiB）<input id="notify-daily-gib" type="number" min="0" max="1000000000" step="0.01" value="0"><small>0 表示不启用此项。</small></label><label class="check-line"><input id="notify-spike" type="checkbox" checked>今日用量突增（3 倍）</label><label class="check-line"><input id="notify-forecast" type="checkbox">预计在重置前用尽</label></div></fieldset><fieldset class="wide"><legend><label class="check-line"><input id="notify-daily" type="checkbox" checked>每日播报</label></legend><label>播报时间<input id="notify-times" placeholder="09:00, 21:00"><small>最多 4 个时间，按后台时区；包含今日、昨日、周期用量、剩余和重置日期。</small></label></fieldset><div class="wide notification-form-actions"><button type="button" id="notification-cancel">取消</button><button type="submit" class="primary">保存渠道</button></div></div></form></dialog></body></html>
