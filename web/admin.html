<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>后台管理 · CFSM</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body><div class="shell">
  <header><a class="brand" href="/admin">CFSM <b>后台管理</b></a><nav><a id="dashboard-link" class="admin-nav-link" href="/">返回看板</a><button id="logout" hidden>退出登录</button></nav></header>
  <p id="message" class="admin-message" role="status" hidden></p>
  <section id="setup-panel" class="admin-login" hidden><h1>创建管理员</h1><form id="setup-form"><label>账号<input id="setup-username" autocomplete="username" maxlength="64" required></label><label>密码<input id="setup-password" type="password" autocomplete="new-password" minlength="6" maxlength="1024" placeholder="至少 6 位" required></label><label>确认密码<input id="setup-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><button class="primary" type="submit">创建并登录</button></form></section>
  <section id="login-panel" class="admin-login" hidden><h1>管理员登录</h1><form id="login-form"><label>账号<input id="login-username" autocomplete="username" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></section>
  <main id="admin-layout" class="admin-layout" hidden>
    <aside class="admin-sidebar"><button data-panel="status" aria-current="page">采集状态</button><button data-panel="source">数据源设置</button><button data-panel="history">历史数据</button><button data-panel="account">管理员账号</button></aside>
    <div class="admin-content">
      <section data-view="status"><div class="admin-heading"><h1>采集状态</h1><div><button id="reload-status">刷新</button><button id="collect">立即采集</button></div></div><div id="status-grid" class="status-grid"></div><div class="admin-box"><dl id="collection-details" class="detail-grid"></dl><p id="collection-error" class="collection-error" hidden></p></div></section>
      <section data-view="source" hidden><h1>数据源设置</h1><form id="source-form" class="admin-box form-grid"><label class="wide">CFSM 地址<input id="source-url" type="url" placeholder="https://status.example.com" autocomplete="off" required></label><label class="wide">App 访问口令<input id="source-key" type="password" autocomplete="new-password" maxlength="32"><small id="key-hint"></small></label><label>采集间隔（秒）<input id="source-interval" type="number" min="60" max="86400" required></label><div class="form-action"><button class="primary" type="submit">验证连接并保存</button></div></form></section>
      <section data-view="history" hidden><h1>历史数据</h1><div class="admin-box"><dl id="database-details" class="detail-grid"></dl></div><form id="retention-form" class="admin-box form-grid"><label>保留天数<input id="retention-days" type="number" min="30" max="3650" required><small>缩短天数会清理过期记录。</small></label><div class="form-action"><button type="submit">保存并清理过期记录</button></div></form><div class="admin-box"><form id="history-form" class="history-filters"><label>节点<select id="history-node" required></select></label><label>开始日期<input id="history-from" type="date" required></label><label>结束日期<input id="history-to" type="date" required></label><button type="submit">查询</button></form><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>日期</th><th>已记录 GiB</th><th>样本</th><th>记录状态</th></tr></thead><tbody id="history-rows"></tbody></table></div><div class="pagination"><span id="history-count"></span><div><button id="previous-page" disabled>上一页</button><button id="next-page" disabled>下一页</button></div></div></div><div class="admin-box danger-zone"><div><h2>清空流量历史</h2><p>清除所有节点的每日记录和采样基准。</p></div><button id="clear-open" class="danger-button">清空历史</button></div></section>
      <section data-view="account" hidden><h1>管理员账号</h1><form id="account-form" class="admin-box form-grid"><label>账号<input id="account-username" autocomplete="username" maxlength="64" required></label><label>当前密码<input id="account-current" type="password" autocomplete="current-password" required></label><label>新密码<input id="account-password" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><label>确认新密码<input id="account-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><div class="form-action wide"><small>保存后所有登录会话失效。</small><button class="primary" type="submit">保存账号</button></div></form></section>
    </div>
  </main>
<footer class="app-footer"><span id="app-version"></span></footer></div><dialog id="clear-dialog"><h2>确认清空历史？</h2><p>数据源和管理员账号保留。</p><div class="confirm-actions"><button id="clear-cancel">取消</button><button id="clear-confirm" class="danger-button">确认清空</button></div></dialog></body></html>
