<!doctype html>
<html lang="zh-CN">
<head><script src="/appearance.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CFSM 流量看板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="CFSM 流量看板首页">CFSM <b>流量看板</b></a>
      <nav aria-label="管理"><button id="theme-toggle" type="button" aria-label="切换主题">◐</button><span id="view-mode" class="view-mode">公开视图</span><a id="admin-link" class="admin-nav-link" href="/admin" hidden>后台管理</a><button id="auth-button">管理员登录 <span>↗</span></button></nav>
    </header>
    <main>
      <div class="update"><span id="updated">等待数据</span><span id="poll-hint"></span><button id="refresh" class="quiet" aria-label="刷新数据">↻ 刷新</button></div>
      <div id="notice" role="status" hidden></div>
      <section class="toolbar"><div class="filters"><input id="search" type="search" placeholder="搜索节点或分组" aria-label="搜索节点或分组"><select id="node-filter" aria-label="选择节点"><option value="">全部节点</option></select><select id="sort" aria-label="节点排序"><option value="attention">关注优先</option><option value="today">今日用量从高到低</option><option value="remaining">余量从少到多</option></select></div></section>
      <div id="attention-note" class="attention-note" role="status"></div>
      <section class="cards-panel" id="cards-panel"><div class="node-flow-heading"><h2>节点流量 <span id="node-count">0</span></h2><div class="section-actions"><div class="range" role="group" aria-label="节点显示样式" data-block-tools="cards-panel"><button data-node-view="cards" aria-pressed="true">卡片</button><button data-node-view="list" aria-pressed="false">列表</button></div><button class="collapse-toggle" data-collapse="cards-panel" data-label="节点流量" aria-controls="node-flow-body" aria-expanded="true">收起</button></div></div><div id="node-flow-body"><div id="cards" class="node-cards"></div><div id="node-list-wrap" class="node-list-wrap" role="region" aria-label="节点流量列表" tabindex="0" hidden><table class="node-flow-table"><thead><tr><th scope="col">节点</th><th scope="col">今日 <small>GiB</small></th><th scope="col">昨日 <small>GiB</small></th><th scope="col">周期已用 <small>GiB</small></th><th scope="col">剩余 <small>GiB</small></th><th scope="col">总配额 <small>GiB</small></th><th scope="col">使用率</th><th scope="col">重置日期</th><th scope="col">状态</th></tr></thead><tbody id="node-list"></tbody></table></div></div></section>
      <section class="details-panel" id="details"><div class="details-heading"><h2>每日明细 <span>GiB</span></h2><div class="section-actions"><button id="table-range" data-block-tools="details">查看 30 天</button><button class="collapse-toggle" data-collapse="details" data-label="每日明细" aria-controls="details-body" aria-expanded="true">收起</button></div></div><div id="details-body"><div class="daily-table-wrap"><table class="daily-table" aria-label="每日流量明细"><thead id="daily-head"></thead><tbody id="nodes"></tbody></table></div></div></section>

    </main>
    <footer class="app-footer"><span id="app-version"></span></footer>

  </div>
  <dialog id="traffic-dialog" aria-labelledby="history-title"><div class="history-heading"><div class="traffic-dialog-title"><h2 id="history-title"></h2></div><div class="section-actions"><div class="range" aria-label="流量日期范围"><button data-range="7" aria-pressed="false">7 天</button><button data-range="14" aria-pressed="true">14 天</button><button data-range="30" aria-pressed="false">30 天</button></div><button type="button" data-close="traffic-dialog" class="quiet chart-close" aria-label="关闭节点流量">×</button></div></div><p id="history-label"></p><div class="legend"><span>GiB</span><span><i id="chart-color"></i>日用量</span><span><i class="spike"></i>用量突增</span><span><b>*</b>部分记录</span><span><i class="missing"></i>缺少样本</span></div><div class="chart-scroll"><div id="chart" class="chart"></div></div><div id="day-detail" class="day-detail" aria-live="polite"></div></dialog>
  <dialog id="login-dialog"><form id="login-form"><div class="dialog-head"><div><h2>管理员登录</h2></div><button type="button" data-close="login-dialog" class="quiet" aria-label="关闭">×</button></div><label>管理员账号<input id="username" name="username" autocomplete="username" required></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="form-message" role="alert"></p><button class="primary" type="submit">登录</button></form></dialog>

</body>
</html>
