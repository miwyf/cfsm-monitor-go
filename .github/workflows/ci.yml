name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(go run . --version)" = "cfsm-monitor-go v$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Check formatting and Go
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race ./...
      - name: Check frontend
        run: |
          node --check web/app.js
          node --check web/admin.js
          node --check web/appearance.js
          node --check web/notifications.js
          node --test tests/*.test.mjs

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure image tags
        id: image
        env:
          CFSM_REPOSITORY: ${{ github.repository }}
          CFSM_VERSION: ${{ needs.test.outputs.version }}
          CFSM_PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          image="ghcr.io/${CFSM_REPOSITORY,,}"
          echo "publish=$CFSM_PUBLISH" >> "$GITHUB_OUTPUT"
          if [[ "$CFSM_PUBLISH" == "true" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "tags=$image:$CFSM_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "tags=$image:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'tags=cfsm-monitor-go:ci' >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build AMD64 and ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: ${{ steps.image.outputs.publish != 'true' && format('type=oci,dest={0}/cfsm-monitor-go.oci.tar', runner.temp) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
